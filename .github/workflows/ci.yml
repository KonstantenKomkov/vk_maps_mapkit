name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Формат, анализ, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Зависимости
        run: ./tool/bootstrap.sh
      - name: Проверка
        run: ./tool/check.sh
