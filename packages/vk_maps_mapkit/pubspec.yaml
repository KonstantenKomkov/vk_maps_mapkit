name: vk_maps_mapkit
description: "Карта VK Карт во Flutter: виджет VkMap поверх нативных SDK для Android и iOS."
version: 0.1.0
repository: https://github.com/KonstantenKomkov/vk_maps_mapkit
issue_tracker: https://github.com/KonstantenKomkov/vk_maps_mapkit/issues

environment:
  flutter: ">=3.35.0"
  sdk: ^3.9.0

flutter:
  plugin:
    platforms:
      android:
        default_package: vk_maps_mapkit_android
      ios:
        default_package: vk_maps_mapkit_ios

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  vk_maps_mapkit_android: ^0.1.0
  vk_maps_mapkit_ios: ^0.1.0
  vk_maps_mapkit_platform_interface: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

topics:
  - vk
  - maps
  - map
  - geo
